# okx.manekiai.io — dedicated hostname for the OKX AI instance (127.0.0.1:4183)
# on the preview box. Needed because the instance's own web app (the
# #authorize link-back for live agents) uses absolute paths and must be the
# origin's root; the /okx/ location on paper.manekiai.io stays for the API.
#
# Steps once the Cloudflare A record `okx` → box IP (proxied) exists:
#   sudo cp ~/vectora-okx/deploy/nginx_okx_host.conf /etc/nginx/sites-enabled/vectora-okx.conf
#   sudo certbot certonly --webroot -w /var/www/certbot -d okx.manekiai.io
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name okx.manekiai.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name okx.manekiai.io;
    ssl_certificate     /etc/letsencrypt/live/okx.manekiai.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okx.manekiai.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 150s;
    }
}
