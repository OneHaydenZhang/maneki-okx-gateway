# OKX AI gateway — add this `location` block to BOTH the paper.manekiai.io :443
# server and the default (:80 / bare IP) server in /etc/nginx/sites-enabled/vectora-paper.conf
# on the preview box. Everything under /okx/ goes to the separate OKX instance
# (127.0.0.1:4183); the preview app on :4180 is untouched.
#
#   sudo nano /etc/nginx/sites-enabled/vectora-paper.conf   # paste inside `server { … }`
#   sudo nginx -t && sudo systemctl reload nginx
location ^~ /okx/ {
    proxy_pass http://127.0.0.1:4183;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # x402 replay carries PAYMENT-SIGNATURE and expects PAYMENT-RESPONSE back;
    # nginx passes custom headers through by default (they contain no underscores).
    proxy_read_timeout 150s;
}
